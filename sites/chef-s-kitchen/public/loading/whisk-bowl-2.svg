<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><style>
.o{fill:none;stroke:#2E5E36;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.a{fill:none;stroke:#45844D;stroke-width:3.5;stroke-linecap:round}
.whisk{transform-box:view-box;transform-origin:60px 14px;animation:whisk 0.92s ease-in-out -0.79s infinite alternate}
