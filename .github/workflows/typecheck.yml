name: Typecheck

# Fast correctness gate. Runs `tsc --noEmit` for every site against a freshly built
# @keenan/services, so the snake_case/camelCase service-result bug class (and any other
# type error) is caught on every push/PR — not discovered at runtime. The deploy build
# also enforces types (ignoreBuildErrors: false); this job is the quicker signal.
#
# It then runs the unit tests for template/ AND every site. check-shared-sync.mjs only
# catches DIVERGENCE between the copies, so a rule weakened identically in all three
# (e.g. the password strength policy) sails past it and past tsc — the tests are the
# only gate that objects.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail fast on shared-module drift (channel-agnostic files that must stay
      # identical to template/ across every site). Needs no deps — pure file diff.
      - name: Check shared-module sync (template -> sites)
        run: node orchestrator/check-shared-sync.mjs

      - name: Checkout @keenan/services
        uses: actions/checkout@v4
        with:
          repository: cmlibra71/keenan-group-services
          token: ${{ secrets.GH_PAT }}
          path: _services

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and pack @keenan/services
        run: |
          cd _services
          npm install
          npm run build
          npm pack
          mv keenan-services-*.tgz ../keenan-services-1.0.0.tgz

      - name: Point the workspace at the packed services tarball
        run: sed -i 's|"file:../keenan-group-services"|"file:./keenan-services-1.0.0.tgz"|' package.json

      - name: Install workspace
        run: |
          # @keenan/services is repacked fresh above, so its tarball hash never
          # matches the integrity pinned in the committed lockfile (npm pack is not
          # byte-reproducible). Drop the stale integrity/resolved for that one entry
          # and let npm recompute it from the on-disk tarball; all other deps stay locked.
          node -e "const fs=require('fs'),p='package-lock.json',j=JSON.parse(fs.readFileSync(p,'utf8')),e=(j.packages||{})['node_modules/@keenan/services'];if(e){delete e.integrity;delete e.resolved;fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');}"
          npm install

      - name: Typecheck every site + template
        run: |
          code=0
          for cfg in template/tsconfig.json sites/*/tsconfig.json; do
            echo "::group::tsc --noEmit -p $cfg"
            if npx tsc --noEmit -p "$cfg"; then
              echo "OK: $cfg"
            else
              echo "::error::Type errors in $cfg"
              code=1
            fi
            echo "::endgroup::"
          done
          exit $code

      # Must run after "Install workspace" — the tests import @keenan/services, and tsx
      # is a root devDependency installed by that step.
      - name: Unit tests (template + every site)
        run: npm test
