name: Deploy

# main = live blue-green deploy (auto-promotes once it passes checks).
# staging = deployed-but-NOT-live: each site's build lands on its staging port
# behind the basic-auth preview.<domain> host; promote/discard from the host.
on:
  push:
    branches: [main, staging]

# Serialize deploys: only one build+deploy for main runs at a time. A newer push
# that lands while a deploy is in flight is QUEUED (not cancelled) so the in-flight
# container swap finishes cleanly before the next one starts. Without this, two
# pushes close together race each other over the same storefront containers on the
# shared EC2 box and an older image can land last. Mirrors the portal repo.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  EC2_INSTANCE: i-07fb3cc6aeea2eb49
  AWS_REGION: ap-southeast-2
  DOCKER_NETWORK: app-network

jobs:
  # Discover which sites exist in sites/
  discover:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.sites.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: List sites
        id: sites
        run: |
          SITES=$(ls -d sites/*/ 2>/dev/null | xargs -I{} basename {} | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "matrix=$SITES" >> $GITHUB_OUTPUT
          echo "Sites found: $SITES"

  # Build Docker image for each site and push to GHCR
  build:
    needs: discover
    if: needs.discover.outputs.sites != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        site: ${{ fromJson(needs.discover.outputs.sites) }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout @keenan/services
        uses: actions/checkout@v4
        with:
          repository: cmlibra71/keenan-group-services
          token: ${{ secrets.GH_PAT }}
          path: _services

      - name: Build and pack @keenan/services tarball
        run: |
          cd _services
          npm install
          npm run build
          npm pack
          mv keenan-services-*.tgz ../keenan-services-1.0.0.tgz

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read site config
        id: config
        run: |
          CONFIG="sites/${{ matrix.site }}/site.config.json"
          CHANNEL_ID=$(jq -r '.channelId' "$CONFIG")
          echo "channel_id=${CHANNEL_ID}" >> $GITHUB_OUTPUT

      # :latest only moves on main — a staged build must never be picked up by
      # a live deploy.
      - name: Compute image tags
        id: tags
        run: |
          TAGS="ghcr.io/${{ github.repository_owner }}/keenan-channels-${{ matrix.site }}:${{ github.sha }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAGS="$TAGS"$'\n'"ghcr.io/${{ github.repository_owner }}/keenan-channels-${{ matrix.site }}:latest"
          fi
          { echo "tags<<EOF"; echo "$TAGS"; echo "EOF"; } >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.site
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SITE_NAME=${{ matrix.site }}
            CHANNEL_ID=${{ steps.config.outputs.channel_id }}
            GIT_SHA=${{ github.sha }}

  # Deploy each site to EC2 via SSM
  deploy:
    needs: [discover, build]
    if: needs.discover.outputs.sites != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.discover.outputs.sites) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read site config
        id: config
        run: |
          CONFIG="sites/${{ matrix.site }}/site.config.json"
          CHANNEL_ID=$(jq -r '.channelId' "$CONFIG")
          DOMAIN=$(jq -r '.domain' "$CONFIG")
          PORT=$(jq -r '.port' "$CONFIG")
          INDEXABLE=$(jq -r '.indexable // false' "$CONFIG")

          echo "channel_id=${CHANNEL_ID}" >> $GITHUB_OUTPUT
          echo "domain=${DOMAIN}" >> $GITHUB_OUTPUT
          echo "port=${PORT}" >> $GITHUB_OUTPUT
          echo "indexable=${INDEXABLE}" >> $GITHUB_OUTPUT

      # Refresh the app's env file on the host, then run the blue-green deploy
      # script (shipped by the PORTAL repo — the single owner of deploy.sh).
      # The script starts the new color on the idle port, health-gates it on its
      # direct port (sha + DB readiness), flips Caddy gracefully, and drains the
      # old container — zero downtime. The SSM invocation is SYNCHRONOUS: a
      # deploy.sh abort fails this job.
      - name: Deploy via SSM (blue-green)
        run: |
          SITE="${{ matrix.site }}"
          CHANNEL_ID="${{ steps.config.outputs.channel_id }}"
          DOMAIN="${{ steps.config.outputs.domain }}"
          INDEXABLE="${{ steps.config.outputs.indexable }}"
          MODE=deploy
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then MODE=stage; fi
          echo "Mode: $MODE"

          # QUOTED heredoc: secrets may contain $ and an unquoted heredoc lets
          # bash expand them into garbage. GitHub-actions expressions
          # substitute before bash runs, so all values below use those, not shell vars.
          ENV_B64=$(cat <<'EOF' | base64 -w0
          COMMERCE_DATABASE_URL=${{ secrets.COMMERCE_DATABASE_URL }}
          CHANNEL_ID=${{ steps.config.outputs.channel_id }}
          CHANNEL_KEY=${{ matrix.site }}
          SITE_URL=https://${{ steps.config.outputs.domain }}
          SITE_INDEXABLE=${{ steps.config.outputs.indexable }}
          STOREFRONT_REVALIDATE_SECRET=${{ secrets.STOREFRONT_REVALIDATE_SECRET }}
          CMS_PREVIEW_SECRET=${{ secrets.CMS_PREVIEW_SECRET }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          E2E_LOGIN_SECRET=${{ secrets.E2E_LOGIN_SECRET }}
          TEST_CHECKOUT_SECRET=${{ secrets.TEST_CHECKOUT_SECRET }}
          TEST_EMAIL_RECIPIENT=chrisbmosely@gmail.com
          STAFF_NOTIFICATIONS_EMAIL=${{ secrets.STAFF_NOTIFICATIONS_EMAIL || 'chrisbmosely@gmail.com' }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}
          MEILI_URL=http://keenan-search:7700
          MEILI_API_KEY=${{ secrets.MEILI_MASTER_KEY }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=ap-southeast-2
          GUARD_MODE=${{ vars.GUARD_MODE || 'log' }}
          GUARD_TRUST_CF_IP=${{ vars.GUARD_TRUST_CF_IP || 'false' }}
          GUARD_XFF_TRUSTED_HOPS=${{ vars.GUARD_XFF_TRUSTED_HOPS || '1' }}
          GUARD_ALLOW_IPS=${{ vars.GUARD_ALLOW_IPS }}
          GUARD_CONTACT=${{ vars.GUARD_CONTACT }}
          EOF
          )

          CMD_ID=$(aws ssm send-command \
            --instance-ids ${{ env.EC2_INSTANCE }} \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 900 \
            --parameters "commands=[
              \"echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin\",
              \"echo ${ENV_B64} | base64 -d | sed 's/^[[:space:]]*//' > /home/ubuntu/deploy/env/${SITE}.env && chmod 600 /home/ubuntu/deploy/env/${SITE}.env\",
              \"/home/ubuntu/deploy/deploy.sh ${MODE} ${SITE} ${{ github.sha }}\"
            ]" \
            --query 'Command.CommandId' --output text)

          echo "SSM command: $CMD_ID — waiting for completion…"
          POLL_ERRS=0
          for i in {1..120}; do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id ${{ env.EC2_INSTANCE }} --query 'Status' --output text 2>/dev/null || echo PollError)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|DeliveryTimedOut) break ;;
              PollError)
                # A brief InvocationDoesNotExist right after send-command is normal;
                # persistent poll errors (e.g. IAM) must fail fast, not spin blind.
                POLL_ERRS=$((POLL_ERRS+1))
                if [ "$POLL_ERRS" -ge 6 ]; then echo "Cannot poll SSM status ($POLL_ERRS consecutive errors — IAM?)"; break; fi ;;
              *) POLL_ERRS=0 ;;
            esac
            sleep 10
          done

          echo "--- deploy.sh output ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id ${{ env.EC2_INSTANCE }} --query 'StandardOutputContent' --output text
          echo "--- deploy.sh stderr ---"
          aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id ${{ env.EC2_INSTANCE }} --query 'StandardErrorContent' --output text

          if [ "$STATUS" != "Success" ]; then
            echo "DEPLOY FAILED (SSM status: $STATUS)"
            exit 1
          fi

      # Verify the FLIP took: the public domain must serve THIS commit. A 200
      # alone proves nothing — the old container answers 200 right up until the
      # flip. Hard-fails the job on timeout (the old warn-only check let broken
      # deploys pass silently).
      - name: Verify staged build (staging branch)
        if: github.ref == 'refs/heads/staging'
        run: |
          # staging port = site port + 20 (3001->3021, 3002->3022)
          SPORT=$(( ${{ steps.config.outputs.port }} + 20 ))
          CMD_ID=$(aws ssm send-command \
            --instance-ids ${{ env.EC2_INSTANCE }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"curl -s --max-time 10 http://127.0.0.1:${SPORT}/api/health\"]" \
            --query 'Command.CommandId' --output text)
          sleep 8
          BODY=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
            --instance-id ${{ env.EC2_INSTANCE }} --query 'StandardOutputContent' --output text)
          LIVE=$(echo "$BODY" | jq -r '.commit // "none"')
          if [ "$LIVE" != "${{ github.sha }}" ]; then
            echo "FAILED: staged ${{ matrix.site }} serves $LIVE, expected ${{ github.sha }}"; exit 1
          fi
          echo "Staged build verified on port ${SPORT}: $LIVE"
          PUB=$(curl -s --max-time 10 -u "keenan:${{ secrets.PREVIEW_PASSWORD }}" "https://preview.${{ steps.config.outputs.domain }}/api/health" | jq -r '.commit // "unreachable"' 2>/dev/null || echo unreachable)
          echo "Public preview host check (needs DNS+cert): $PUB"

      - name: Verify deployment (sha match)
        if: github.ref == 'refs/heads/main'
        run: |
          DOMAIN="${{ steps.config.outputs.domain }}"
          EXPECTED="${{ github.sha }}"
          for i in {1..18}; do
            BODY=$(curl -s --max-time 10 "https://${DOMAIN}/api/health" 2>/dev/null || echo "")
            LIVE=$(echo "$BODY" | jq -r '.commit // "none"' 2>/dev/null || echo "none")
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "Deployment verified: https://${DOMAIN} serves $LIVE"
              exit 0
            fi
            echo "Waiting for flip… (attempt $i/18, live: $LIVE)"
            sleep 5
          done
          echo "FAILED: https://${DOMAIN} never served ${EXPECTED}"
          exit 1

