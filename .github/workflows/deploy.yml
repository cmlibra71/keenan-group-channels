name: Deploy

on:
  push:
    branches: [main]

# Serialize deploys: only one build+deploy for main runs at a time. A newer push
# that lands while a deploy is in flight is QUEUED (not cancelled) so the in-flight
# container swap finishes cleanly before the next one starts. Without this, two
# pushes close together race each other over the same storefront containers on the
# shared EC2 box and an older image can land last. Mirrors the portal repo.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  EC2_INSTANCE: i-07fb3cc6aeea2eb49
  AWS_REGION: ap-southeast-2
  DOCKER_NETWORK: app-network

jobs:
  # Discover which sites exist in sites/
  discover:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.sites.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: List sites
        id: sites
        run: |
          SITES=$(ls -d sites/*/ 2>/dev/null | xargs -I{} basename {} | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "matrix=$SITES" >> $GITHUB_OUTPUT
          echo "Sites found: $SITES"

  # Build Docker image for each site and push to GHCR
  build:
    needs: discover
    if: needs.discover.outputs.sites != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        site: ${{ fromJson(needs.discover.outputs.sites) }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout @keenan/services
        uses: actions/checkout@v4
        with:
          repository: cmlibra71/keenan-group-services
          token: ${{ secrets.GH_PAT }}
          path: _services

      - name: Build and pack @keenan/services tarball
        run: |
          cd _services
          npm install
          npm run build
          npm pack
          mv keenan-services-*.tgz ../keenan-services-1.0.0.tgz

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read site config
        id: config
        run: |
          CONFIG="sites/${{ matrix.site }}/site.config.json"
          CHANNEL_ID=$(jq -r '.channelId' "$CONFIG")
          echo "channel_id=${CHANNEL_ID}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.site
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/keenan-channels-${{ matrix.site }}:latest
          build-args: |
            SITE_NAME=${{ matrix.site }}
            CHANNEL_ID=${{ steps.config.outputs.channel_id }}

  # Deploy each site to EC2 via SSM
  deploy:
    needs: [discover, build]
    if: needs.discover.outputs.sites != '[]'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        site: ${{ fromJson(needs.discover.outputs.sites) }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Read site config
        id: config
        run: |
          CONFIG="sites/${{ matrix.site }}/site.config.json"
          CHANNEL_ID=$(jq -r '.channelId' "$CONFIG")
          DOMAIN=$(jq -r '.domain' "$CONFIG")
          PORT=$(jq -r '.port' "$CONFIG")
          INDEXABLE=$(jq -r '.indexable // false' "$CONFIG")

          echo "channel_id=${CHANNEL_ID}" >> $GITHUB_OUTPUT
          echo "domain=${DOMAIN}" >> $GITHUB_OUTPUT
          echo "port=${PORT}" >> $GITHUB_OUTPUT
          echo "indexable=${INDEXABLE}" >> $GITHUB_OUTPUT

      - name: Deploy via SSM
        run: |
          SITE="${{ matrix.site }}"
          PORT="${{ steps.config.outputs.port }}"
          CHANNEL_ID="${{ steps.config.outputs.channel_id }}"
          DOMAIN="${{ steps.config.outputs.domain }}"
          INDEXABLE="${{ steps.config.outputs.indexable }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/keenan-channels-${SITE}:latest"
          CONTAINER="keenan-channel-${SITE}"

          # The Next data cache (unstable_cache — category listings, channel
          # store reads) lives at .next/cache inside the app dir. Mount it from
          # the host so the warmed cache SURVIVES deploys; uid 1001 = nextjs.
          aws ssm send-command \
            --instance-ids ${{ env.EC2_INSTANCE }} \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin\",
              \"docker pull -q ${IMAGE}\",
              \"mkdir -p /home/ubuntu/storefront-cache/${SITE} && chown -R 1001:1001 /home/ubuntu/storefront-cache/${SITE}\",
              \"find /home/ubuntu/storefront-cache/${SITE} -type f -mtime +14 -delete 2>/dev/null || true\",
              \"docker stop ${CONTAINER} || true\",
              \"docker rm ${CONTAINER} || true\",
              \"docker run -d --name ${CONTAINER} --log-opt max-size=50m --log-opt max-file=3 --restart unless-stopped --network ${DOCKER_NETWORK} -p 127.0.0.1:${PORT}:3000 -v /home/ubuntu/storefront-cache/${SITE}:/app/sites/${SITE}/.next/cache -e COMMERCE_DATABASE_URL=${{ secrets.COMMERCE_DATABASE_URL }} -e CHANNEL_ID=${CHANNEL_ID} -e CHANNEL_KEY=${SITE} -e SITE_URL=https://${DOMAIN} -e SITE_INDEXABLE=${INDEXABLE} -e STOREFRONT_REVALIDATE_SECRET=${{ secrets.STOREFRONT_REVALIDATE_SECRET }} -e CMS_PREVIEW_SECRET=${{ secrets.CMS_PREVIEW_SECRET }} -e SESSION_SECRET=${{ secrets.SESSION_SECRET }} -e E2E_LOGIN_SECRET=${{ secrets.E2E_LOGIN_SECRET }} -e TEST_EMAIL_RECIPIENT=chrisbmosely@gmail.com -e STAFF_NOTIFICATIONS_EMAIL=${{ secrets.STAFF_NOTIFICATIONS_EMAIL || 'chrisbmosely@gmail.com' }} -e GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }} -e GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }} -e MEILI_URL=http://keenan-search:7700 -e MEILI_API_KEY=${{ secrets.MEILI_MASTER_KEY }} -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} -e AWS_REGION=ap-southeast-2 ${IMAGE}\",
              \"docker image prune -af\",
              \"if ! grep -q '${DOMAIN}' /etc/caddy/Caddyfile 2>/dev/null; then echo '' >> /etc/caddy/Caddyfile && echo '${DOMAIN} { reverse_proxy localhost:${PORT} }' >> /etc/caddy/Caddyfile && systemctl reload caddy && echo 'Added Caddy config for ${DOMAIN}'; else echo 'Caddy config for ${DOMAIN} already exists'; fi\"
            ]" \
            --output text

          echo "Deploy command sent for ${SITE} (https://${DOMAIN} -> port ${PORT})"

      - name: Wait for deployment
        run: |
          DOMAIN="${{ steps.config.outputs.domain }}"
          echo "Waiting for https://${DOMAIN} to come up..."
          sleep 20

          for i in {1..12}; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "https://${DOMAIN}" 2>/dev/null || echo "000")

            if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "307" ]; then
              echo "Site ${{ matrix.site }} is live at https://${DOMAIN}"
              exit 0
            fi

            echo "Waiting... (attempt $i/12, status: $HTTP_CODE)"
            sleep 5
          done

          echo "Warning: ${{ matrix.site }} did not respond within 80 seconds (may still be starting)"

